# Backtesting Configuration
backtesting:
  # General settings
  initial_capital: 1000000  # $1M
  start_date: "2015-01-01"
  end_date: "2024-01-01"
  benchmark: "SPY"  # S&P 500 ETF
  
  # Transaction costs
  transaction_costs:
    commission: 0.001  # 10 bps per trade
    slippage: 0.0005  # 5 bps slippage
    market_impact: 0.0001  # 1 bp market impact
  
  # Execution
  execution:
    method: "market_order"  # market_order, limit_order, twap, vwap
    delay: 0  # seconds delay
    partial_fills: true
    min_trade_size: 100  # minimum trade size in dollars
  
  # Portfolio management
  portfolio:
    rebalancing_frequency: "monthly"
    rebalancing_threshold: 0.05
    cash_management: true
    margin_trading: false
    short_selling: false
  
  # Performance metrics
  metrics:
    # Return metrics
    returns:
      - "total_return"
      - "annualized_return"
      - "cumulative_return"
      - "excess_return"
    
    # Risk metrics
    risk:
      - "volatility"
      - "sharpe_ratio"
      - "sortino_ratio"
      - "calmar_ratio"
      - "max_drawdown"
      - "var_95"
      - "cvar_95"
    
    # Trade metrics
    trades:
      - "total_trades"
      - "win_rate"
      - "avg_trade_return"
      - "avg_winning_trade"
      - "avg_losing_trade"
      - "profit_factor"
      - "expectancy"
    
    # Portfolio metrics
    portfolio:
      - "turnover"
      - "exposure"
      - "concentration"
      - "diversification_ratio"
  
  # Benchmark comparison
  benchmark_comparison:
    benchmark_symbols: ["SPY", "QQQ", "IWM"]
    attribution_analysis: true
    tracking_error: true
    information_ratio: true
  
  # Reporting
  reporting:
    generate_plots: true
    save_results: true
    output_format: ["csv", "json", "html"]
    plot_types:
      - "equity_curve"
      - "drawdown"
      - "rolling_returns"
      - "rolling_sharpe"
      - "rolling_volatility"
      - "trade_analysis"
      - "risk_attribution"
  
  # Walk-forward analysis
  walk_forward:
    enabled: true
    train_period: 252  # days
    test_period: 63   # days
    step_size: 21    # days
    min_train_period: 126  # minimum training period
  
  # Monte Carlo simulation
  monte_carlo:
    enabled: true
    simulations: 1000
    confidence_levels: [0.05, 0.25, 0.5, 0.75, 0.95]
