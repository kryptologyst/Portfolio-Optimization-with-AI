# Data Configuration
data:
  # Data sources
  sources:
    market_data:
      type: "yfinance"  # yfinance, csv, parquet
      symbols: ["AAPL", "GOOGL", "MSFT", "AMZN", "TSLA", "NVDA", "META", "NFLX"]
      start_date: "2015-01-01"
      end_date: "2024-01-01"
      frequency: "1d"
    
    fundamentals:
      type: "synthetic"  # synthetic, csv, api
      features: ["market_cap", "pe_ratio", "pb_ratio", "debt_to_equity", "roe"]
  
  # Data preprocessing
  preprocessing:
    handle_missing: "forward_fill"
    outlier_method: "iqr"  # iqr, zscore, winsorize
    outlier_threshold: 3.0
    normalize_features: true
  
  # Feature engineering
  features:
    technical_indicators:
      sma_periods: [5, 10, 20, 50, 200]
      ema_periods: [12, 26]
      rsi_period: 14
      macd_periods: [12, 26, 9]
      bollinger_period: 20
      bollinger_std: 2
    
    fundamental_features:
      ratios: ["pe_ratio", "pb_ratio", "debt_to_equity", "roe", "roa"]
      growth_metrics: ["revenue_growth", "earnings_growth"]
    
    risk_features:
      volatility_windows: [5, 10, 21, 63]
      correlation_windows: [21, 63, 252]
      beta_windows: [21, 63, 252]
  
  # Label generation
  labels:
    forward_returns:
      horizons: [1, 5, 21, 63]  # days
      method: "simple"  # simple, log, excess
    
    risk_labels:
      volatility_threshold: 0.2
      drawdown_threshold: -0.1
    
    regime_labels:
      method: "volatility_regime"  # volatility_regime, trend_regime
      lookback: 252

# Cross-validation
cv:
  method: "expanding_window"  # expanding_window, rolling_window, purged_cv
  train_size: 252  # days
  test_size: 63   # days
  step_size: 21   # days
  purge_days: 5   # days to purge between train/test
  embargo_days: 2 # days embargo after test period
